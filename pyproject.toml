[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-drive"
version = "0.0.1"
description = "Encrypted drive backend built with FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "SQLAlchemy==2.0.36",
  "pydantic==2.9.2",
  "pydantic-settings==2.4.0",
  "psycopg[binary,pool]==3.2.1",
  "python-multipart==0.0.9",
  "passlib[bcrypt]==1.7.4",
  "cryptography==42.0.8",
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "mypy==1.11.2",
  "ruff==0.6.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.1"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
select = ["E","F","I","UP"]
exclude = ["infra", ".venv", ".git"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
